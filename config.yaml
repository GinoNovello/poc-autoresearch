llm:
  provider: glm
  model: glm-4-air
  api_key_env: ZAI_API_KEY
  base_url: https://open.bigmodel.cn/api/paas/v4/
  max_tokens: 16384
  temperature: 0.7
  max_retries: 3
  retry_backoff_base: 2

experiment:
  max_iterations: null
  max_history_in_prompt: 20
  timeout_seconds: 30
  tuner_description_line: 1

loss_weights:
  alpha: 1.0
  beta: 10.0

map:
  rpm_min: 800
  rpm_max: 7000
  rpm_points: 16
  load_min: 0.10
  load_max: 1.00
  load_points: 12
  injection_min: 1.0
  injection_max: 20.0
  advance_min: 0.0
  advance_max: 45.0
  expected_rows: 192
